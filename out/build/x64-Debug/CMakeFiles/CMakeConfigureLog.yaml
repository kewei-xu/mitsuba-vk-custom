      /TC 将所有文件编译为 .c                 /TP 将所有文件编译为 .cpp
      /V<string> 设置版本字符串               /Yc[file] 创建 .PCH 文件
      /Yd 将调试信息放在每个 .OBJ 中          /Yl[sym] 为调试库插入 .PCH 引用
      /Yu[file] 使用 .PCH 文件                /Y- 禁用所有 PCH 选项
      /Zm<n> 最大内存分配(默认值的百分比)     /FS 强制使用 MSPDBSRV.EXE
