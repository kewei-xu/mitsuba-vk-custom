      /Og 启用全局优化                        /Oi[-] 启用内部函数
      /Os 优选代码空间                        /Ot 优选代码速度
      /Ox 优化(优选速度)                      
      /favor:<blend|AMD64|INTEL64|ATOM> 选择优化所针对的处理器，为以下值之一:
         blend - 针对几种不同 x64 处理器的优化组合
